[project]
name = "data-performance-lab"
version = "0.2.0"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.34", "pandas>=2.2", "polars>=1.0", "duckdb>=1.2", "pyarrow>=19", "requests>=2.32", "psutil>=6"]

[project.optional-dependencies]
rust = ["datafusion>=50,<55"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28"]

[tool.pytest.ini_options]
pythonpath = ["."]
